<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Captain Woolly - Carnival Jubilee AI Concierge</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F0F4FA;color:#1A1A2E;overflow:hidden}
.app{display:flex;flex-direction:column;height:100dvh}
.header{flex-shrink:0;background:#014E8F;color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:34px;height:34px;background:#B61B38;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:11px;flex-shrink:0}
.title{font-size:15px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tagline{font-size:11px;color:#F6D003;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:flex;align-items:center;gap:5px;flex-shrink:0}
.lang{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:11px;padding:4px 5px;border-radius:6px;font-family:inherit;outline:none}
.btn-admin,.btn-pirate{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:11px;font-weight:600;padding:5px 9px;border-radius:6px;cursor:pointer;font-family:inherit;white-space:nowrap}
.wave{flex-shrink:0;height:6px;background:linear-gradient(90deg,#B61B38,#F6D003,#B61B38)}
.status{flex-shrink:0;text-align:center;font-size:11px;color:#7A8AAA;padding:6px;background:#fff;border-bottom:1px solid #e0e6f0}
.chat{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.msg{display:flex;gap:8px;max-width:100%}
.msg.user{flex-direction:row-reverse}
.bubble{padding:10px 14px;font-size:14px;line-height:1.5;max-width:82%;word-break:break-word;border-radius:16px}
.msg.user .bubble{background:#014E8F;color:#fff;border-bottom-right-radius:4px}
.msg.bot .bubble{background:#fff;color:#1A1A2E;border-bottom-left-radius:4px;border-left:3px solid #B61B38;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;align-self:flex-end;color:#fff;font-weight:700}
.avatar.bot{background:#B61B38}
.avatar.user{background:#014E8F}
.card{background:#fff;border:2px solid #F6D003;border-radius:10px;padding:10px 12px;margin-top:6px;font-size:12px;color:#3A3A5C}
.card .ct{font-weight:700;color:#B61B38;font-size:13px;margin-bottom:6px}
.card .row{margin-bottom:3px}
.card .row b{color:#1A1A2E}
.chips{flex-shrink:0;display:flex;flex-wrap:wrap;gap:6px;padding:6px 12px}
.chip{background:#fff;border:1.5px solid #014E8F;color:#014E8F;border-radius:18px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip:active{background:#014E8F;color:#fff}
.typing{display:inline-flex;gap:4px;padding:12px 16px;background:#fff;border-left:3px solid #B61B38;border-radius:16px;border-bottom-left-radius:4px}
.dot{width:6px;height:6px;background:#B61B38;border-radius:50%;animation:b 1.3s infinite}
.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.input-area{flex-shrink:0;background:#fff;border-top:1px solid #dde4f0;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.input-row{display:flex;gap:8px;align-items:flex-end}
.input{flex:1;min-height:42px;max-height:120px;border:1.5px solid #c0cbde;border-radius:22px;padding:10px 16px;font-size:16px;font-family:inherit;resize:none;outline:none;line-height:1.4;background:#F0F4FA}
.input:focus{border-color:#014E8F;background:#fff}
.send{width:42px;height:42px;border-radius:50%;background:#B61B38;border:none;cursor:pointer;color:#fff;font-size:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.send:disabled{background:#c5cfe0;cursor:not-allowed}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;padding:12px}
.overlay.open{display:flex}
.panel{background:#fff;border-radius:14px;width:100%;max-width:720px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column}
.panel-h{background:#002F5D;color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.panel-h h2{font-size:15px}
.x{background:rgba(255,255,255,.15);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px}
.tabs{display:flex;border-bottom:2px solid #eee;overflow-x:auto}
.tab{padding:10px 16px;font-size:13px;font-weight:600;color:#7A8AAA;cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;font-family:inherit;white-space:nowrap}
.tab.active{color:#B61B38;border-bottom-color:#B61B38}
.body{flex:1;overflow-y:auto;padding:14px}
.pw{display:flex;flex-direction:column;gap:12px;align-items:center;padding:36px 20px}
.pw input{border:1.5px solid #c0cbde;border-radius:10px;padding:10px;font-size:15px;outline:none;text-align:center;letter-spacing:3px;width:240px;font-family:inherit}
.pw button{background:#014E8F;color:#fff;border:none;border-radius:10px;padding:10px 26px;font-weight:700;cursor:pointer;font-family:inherit}
.pw .err{color:#B61B38;font-size:13px;display:none}
.req{border:1px solid #e0e6f0;border-radius:10px;padding:12px;margin-bottom:8px}
.req.pending{border-left:4px solid #F6D003}
.req.resolved{border-left:4px solid #28a745;opacity:.7}
.req-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.req-info{flex:1}
.req-type{font-size:13px;font-weight:700}
.req-guest{font-size:12px;color:#3A3A5C}
.req-time{font-size:11px;color:#7A8AAA}
.req-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:18px}
.req-badge.pending{background:#fff3cd;color:#856404}
.req-badge.resolved{background:#d1f5dc;color:#155724}
.req-actions{margin-top:8px;display:flex;gap:6px}
.req-btn{border:none;border-radius:6px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.req-btn.r{background:#28a745;color:#fff}
.req-btn.d{background:#f0f4fa;color:#3A3A5C}
.empty{text-align:center;padding:40px 20px;color:#7A8AAA;font-size:14px}
.search{border:1.5px solid #c0cbde;border-radius:10px;padding:8px 14px;font-size:14px;outline:none;width:100%;margin-bottom:10px;font-family:inherit}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#002F5D;color:#fff;padding:8px 12px;text-align:left;font-size:12px}
.tbl td{padding:7px 12px;border-bottom:1px solid #eee}
.tbl tr:nth-child(even) td{background:#F0F4FA}
@media(min-width:768px){.chat{max-width:760px;margin:0 auto;width:100%}.input-row{max-width:760px;margin:0 auto}.chips{max-width:760px;margin:0 auto}}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <div class="logo">CCL</div>
      <div style="min-width:0">
        <div class="title" id="ttl">Captain Woolly</div>
        <div class="tagline" id="tag">Choose Fun - Carnival Jubilee</div>
      </div>
    </div>
    <div class="controls">
      <select class="lang" id="langSel" onchange="setLang(this.value)">
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="fr">FR</option>
        <option value="de">DE</option>
        <option value="it">IT</option>
        <option value="pt">PT</option>
        <option value="zh">ZH</option>
      </select>
      <button class="btn-admin" onclick="openAdmin()">Admin</button>
      <button class="btn-pirate" onclick="togglePirate()">Pirate</button>
    </div>
  </header>
  <div class="wave"></div>
  <div class="status" id="status">Carnival Jubilee - Western Caribbean</div>
  <div class="chat" id="chat"></div>
  <div class="chips" id="chips"></div>
  <div class="input-area">
    <div class="input-row">
      <textarea class="input" id="inp" placeholder="Ask Captain Woolly anything..." rows="1" onkeydown="onKey(event)" oninput="resize(this)"></textarea>
      <button class="send" id="sendBtn" onclick="send()">&#10148;</button>
    </div>
  </div>
</div>

<div class="overlay" id="ov" onclick="ovClick(event)">
  <div class="panel">
    <div class="panel-h"><h2>Captain Woolly - Admin</h2><button class="x" onclick="closeAdmin()">&times;</button></div>
    <div class="pw" id="pw">
      <div style="font-size:28px">&#128274;</div>
      <h3>Admin Access</h3>
      <input type="password" id="pwIn" placeholder="password" onkeydown="if(event.key==='Enter')checkPw()">
      <button onclick="checkPw()">Enter</button>
      <span class="err" id="pwErr">Incorrect password</span>
    </div>
    <div id="ac" style="display:none;flex:1;overflow:hidden;flex-direction:column">
      <div class="tabs">
        <button class="tab active" onclick="setTab('r',this)">Requests <span id="badge"></span></button>
        <button class="tab" onclick="setTab('m',this)">Manifest</button>
        <button class="tab" onclick="setTab('c',this)">Chat Log</button>
      </div>
      <div class="body" id="adminBody"></div>
    </div>
  </div>
</div>

<script>
var CABINS = {"1001L":{f:"Betty",l:"Flores"},"1006":{f:"Melissa",l:"Johnson"},"1011L":{f:"Katherine",l:"Scott"},"1071":{f:"Kathleen",l:"Wright"},"1081R":{f:"Helen",l:"Martinez"},"1082L":{f:"Raymond",l:"Allen"},"1115R":{f:"David",l:"Bennett"},"1129L":{f:"Nancy",l:"Cook"},"1140L":{f:"Jeffrey",l:"Turner"},"1199":{f:"Samantha",l:"Davis"},"1205":{f:"David",l:"Flores"},"1221":{f:"Brian",l:"James"},"1229":{f:"Eric",l:"Collins"},"1235":{f:"Charles",l:"Carter"},"1235L":{f:"Nicholas",l:"Thomas"},"1244R":{f:"Kenneth",l:"Hernandez"},"1249":{f:"Barbara",l:"Gray"},"1275":{f:"Carolyn",l:"White"},"1277":{f:"Thomas",l:"Nelson"},"1283":{f:"Kevin",l:"Taylor"},"1403":{f:"Eric",l:"Brooks"},"1412":{f:"Thomas",l:"Taylor"},"1482R":{f:"Anna",l:"Hill"},"672L":{f:"Dorothy",l:"Long"},"677R":{f:"Christine",l:"Adams"},"685L":{f:"Pamela",l:"Rivera"},"693R":{f:"Nancy",l:"Rodriguez"},"704R":{f:"Sandra",l:"Edwards"},"712":{f:"Carolyn",l:"Watson"},"720L":{f:"Nancy",l:"Johnson"},"728L":{f:"William",l:"Turner"},"746R":{f:"Steven",l:"Anderson"},"749":{f:"Emma",l:"Rivera"},"749R":{f:"James",l:"Myers"},"778L":{f:"Rachel",l:"Torres"},"787":{f:"Christopher",l:"Rodriguez"},"788R":{f:"Frank",l:"Diaz"},"828R":{f:"Rachel",l:"Wright"},"834L":{f:"Dorothy",l:"Ramirez"},"848L":{f:"Ryan",l:"Smith"},"848R":{f:"Angela",l:"Diaz"},"865":{f:"Brandon",l:"Martin"},"905R":{f:"Gregory",l:"Gomez"},"921":{f:"Karen",l:"Collins"},"929L":{f:"Eric",l:"Williams"},"973R":{f:"Jessica",l:"Foster"},"984":{f:"Christopher",l:"Nguyen"},"986R":{f:"Jeffrey",l:"Gray"},"991":{f:"William",l:"Flores"},"996R":{f:"Sarah",l:"White"}};

var SVCS = {towels:{lbl:"Extra Towels",cat:"Housekeeping",eta:"15-20 minutes"},towel:{lbl:"Extra Towels",cat:"Housekeeping",eta:"15-20 minutes"},sheets:{lbl:"Fresh Sheets",cat:"Housekeeping",eta:"20-30 minutes"},blanket:{lbl:"Extra Blanket",cat:"Housekeeping",eta:"15-20 minutes"},pillow:{lbl:"Extra Pillow",cat:"Housekeeping",eta:"15-20 minutes"},housekeep:{lbl:"Housekeeping",cat:"Housekeeping",eta:"20-30 minutes"},clean:{lbl:"Stateroom Cleaning",cat:"Housekeeping",eta:"20-30 minutes"},broken:{lbl:"Maintenance Request",cat:"Maintenance",eta:"30-45 minutes"},fix:{lbl:"Maintenance Request",cat:"Maintenance",eta:"30-45 minutes"},repair:{lbl:"Maintenance Request",cat:"Maintenance",eta:"30-45 minutes"},leak:{lbl:"Plumbing Issue",cat:"Maintenance",eta:"20-30 minutes"},toilet:{lbl:"Bathroom Issue",cat:"Maintenance",eta:"20-30 minutes"},ac:{lbl:"AC Issue",cat:"Maintenance",eta:"30-45 minutes"},heat:{lbl:"Temperature Issue",cat:"Maintenance",eta:"30-45 minutes"},noise:{lbl:"Noise Complaint",cat:"Guest Services",eta:"15-20 minutes"},ice:{lbl:"Ice Bucket",cat:"Housekeeping",eta:"10-15 minutes"},toiletries:{lbl:"Toiletry Restock",cat:"Housekeeping",eta:"15-20 minutes"},soap:{lbl:"Toiletry Restock",cat:"Housekeeping",eta:"15-20 minutes"},shampoo:{lbl:"Toiletry Restock",cat:"Housekeeping",eta:"15-20 minutes"}};

var lang="en",pirate=false,chatHistory=[],pending=null,requests=[],unlocked=false,activeTab="r";
var ADMIN_PW="Ron";
var LANGS={en:{p:"Ask Captain Woolly anything...",s:"Carnival Jubilee - Western Caribbean"},es:{p:"Preguntale al Capitan Woolly...",s:"Carnival Jubilee - Caribe Occidental"},fr:{p:"Demandez au Capitaine Woolly...",s:"Carnival Jubilee - Caraibes"},de:{p:"Fragen Sie Kapitan Woolly...",s:"Carnival Jubilee - Karibik"},it:{p:"Chiedi al Capitano Woolly...",s:"Carnival Jubilee - Caraibi"},pt:{p:"Pergunte ao Capitao Woolly...",s:"Carnival Jubilee - Caribe"},zh:{p:"Wen Woolly Chuan Zhang...",s:"Carnival Jubilee"}};

function detectSvc(t){var l=t.toLowerCase();for(var k in SVCS){if(l.indexOf(k)!==-1)return SVCS[k];}return null;}
function timeStr(){return new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmt(t){return escapeHtml(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\n/g,"<br>");}
function resize(el){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,120)+"px";}
function onKey(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}
function scrollDown(){var c=document.getElementById("chat");setTimeout(function(){c.scrollTop=c.scrollHeight;},30);}

function addMsg(role,content,extra){
  var chat=document.getElementById("chat");
  var div=document.createElement("div");
  div.className="msg "+(role==="user"?"user":"bot");
  var av=role==="user"?"U":"W";
  var avc=role==="user"?"user":"bot";
  var html='<div class="avatar '+avc+'">'+av+'</div>';
  html+='<div><div class="bubble">'+fmt(content)+'</div>';
  if(extra)html+=extra;
  html+='</div>';
  div.innerHTML=html;
  chat.appendChild(div);
  scrollDown();
}

function addTyping(){
  var chat=document.getElementById("chat");
  var div=document.createElement("div");
  div.className="msg bot";
  div.id="typingI";
  div.innerHTML='<div class="avatar bot">W</div><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  chat.appendChild(div);
  scrollDown();
}

function rmTyping(){var t=document.getElementById("typingI");if(t)t.remove();}

function setChips(arr){
  var c=document.getElementById("chips");
  c.innerHTML="";
  for(var i=0;i<arr.length;i++){
    (function(label){
      var b=document.createElement("button");
      b.className="chip";
      b.textContent=label;
      b.onclick=function(){document.getElementById("chips").innerHTML="";send(label);};
      c.appendChild(b);
    })(arr[i]);
  }
}

function buildCard(svc,cabin,guest){
  var html='<div class="card">';
  html+='<div class="ct">'+svc.lbl+' - Submitted</div>';
  html+='<div class="row"><b>Cabin:</b> '+cabin+'</div>';
  html+='<div class="row"><b>Guest:</b> '+guest.f+' '+guest.l+'</div>';
  html+='<div class="row"><b>Team:</b> '+svc.cat+'</div>';
  html+='<div class="row"><b>ETA:</b> '+svc.eta+'</div>';
  html+='</div>';
  return html;
}

function submitReq(svc,cabin,guest){
  var entry={id:Date.now(),type:svc.lbl,cat:svc.cat,cabin:cabin,gf:guest.f,gl:guest.l,eta:svc.eta,time:timeStr(),status:"pending"};
  requests.unshift(entry);
  updateBadge();
}

function updateBadge(){
  var n=0;
  for(var i=0;i<requests.length;i++)if(requests[i].status==="pending")n++;
  var b=document.getElementById("badge");
  if(b)b.textContent=n>0?"("+n+")":"";
}

function buildSystem(){
  var p="You are Captain Woolly, the cheerful AI concierge aboard the Carnival Jubilee, Carnival Cruise Line's Excel-class ship homeported in Galveston, Texas. ";
  p+="She sails 7-night Western Caribbean itineraries to Cozumel, Roatan, Belize City, and Costa Maya. ";
  p+="Key features: BOLT roller coaster at sea, Emeril's Bistro 1396, Big Chicken by Shaq, Punchliner Comedy Club, Piano Bar 88, Havana Bar, WaterWorks aqua park, Cloud 9 Spa, Serenity adults-only deck, Casino, Ji Ji Asian Kitchen, Bonsai Sushi, Steakhouse, Cucina del Capitano. ";
  p+="Style: Use Carnival Cruise Line not Lines, guests not passengers, staterooms not rooms. Match the Choose Fun energy - warm, fun, enthusiastic. ";
  if(pirate)p+="PIRATE MODE: Respond in pirate speak with Arr, Ahoy, matey. ";
  if(lang==="es")p+="Respond in Spanish. ";
  else if(lang==="fr")p+="Respond in French. ";
  else if(lang==="de")p+="Respond in German. ";
  else if(lang==="it")p+="Respond in Italian. ";
  else if(lang==="pt")p+="Respond in Portuguese. ";
  else if(lang==="zh")p+="Respond in Chinese. ";
  return p;
}

function send(override){
  var box=document.getElementById("inp");
  var text=(override||box.value).trim();
  if(!text)return;
  if(!override){box.value="";box.style.height="auto";}
  document.getElementById("chips").innerHTML="";
  document.getElementById("sendBtn").disabled=true;
  addMsg("user",text);
  chatHistory.push({role:"user",content:text});

  if(pending&&pending.waiting){
    var key=text.toUpperCase().replace(/\s/g,"");
    var guest=CABINS[key];
    if(!guest){
      var nf="I'm sorry, I couldn't find cabin "+text+". Could you double-check the number? You can find it on your key card or in the Carnival HUB app.";
      addMsg("bot",nf);
      chatHistory.push({role:"assistant",content:nf});
      document.getElementById("sendBtn").disabled=false;
      return;
    }
    var svc=pending.svc;
    submitReq(svc,key,guest);
    var card=buildCard(svc,key,guest);
    var salut=(guest.l.charAt(guest.l.length-1)==="s"?"Ms.":"Mr.")+" "+guest.l;
    var msg="Thank you, "+salut+"! Your request for **"+svc.lbl+"** has been sent to our "+svc.cat+" team and will arrive within **"+svc.eta+"**. Is there anything else I can help you with?";
    addMsg("bot",msg,card);
    chatHistory.push({role:"assistant",content:msg});
    pending=null;
    setChips(["Dining options","Entertainment tonight","Shore excursions","Spa booking"]);
    document.getElementById("sendBtn").disabled=false;
    return;
  }

  var detected=detectSvc(text);
  if(detected){
    pending={svc:detected,waiting:true};
    var ask="Of course! I'll get that arranged for you right away.\n\nCould you please provide your **cabin number**? You can find it on your key card or in the Carnival HUB app.";
    addMsg("bot",ask);
    chatHistory.push({role:"assistant",content:ask});
    document.getElementById("sendBtn").disabled=false;
    return;
  }

  callAI();
}

function callAI(){
  addTyping();
  var msgs=[];
  for(var i=0;i<chatHistory.length;i++)msgs.push({role:chatHistory[i].role,content:chatHistory[i].content});
  fetch("/api/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:1000,stream:true,system:buildSystem(),messages:msgs})
  }).then(function(r){
    if(!r.ok)throw new Error("API error "+r.status);
    rmTyping();
    var chat=document.getElementById("chat");
    var div=document.createElement("div");
    div.className="msg bot";
    div.innerHTML='<div class="avatar bot">W</div><div><div class="bubble" id="streamB"></div></div>';
    chat.appendChild(div);
    scrollDown();
    var bubble=document.getElementById("streamB");
    var reader=r.body.getReader();
    var decoder=new TextDecoder();
    var full="";
    function read(){
      reader.read().then(function(result){
        if(result.done){
          bubble.removeAttribute("id");
          chatHistory.push({role:"assistant",content:full});
          setChips(["What's for dinner?","BOLT roller coaster","Today's port","Spa hours"]);
          document.getElementById("sendBtn").disabled=false;
          return;
        }
        var chunk=decoder.decode(result.value,{stream:true});
        var lines=chunk.split("\n");
        for(var i=0;i<lines.length;i++){
          var line=lines[i];
          if(line.indexOf("data:")!==0)continue;
          var data=line.slice(5).trim();
          if(data==="[DONE]")continue;
          try{
            var ev=JSON.parse(data);
            if(ev.type==="content_block_delta"&&ev.delta&&ev.delta.text){
              full+=ev.delta.text;
              bubble.innerHTML=fmt(full);
              scrollDown();
            }
          }catch(e){}
        }
        read();
      }).catch(function(err){
        rmTyping();
        addMsg("bot","Something went sideways - let's try again! ("+err.message+")");
        document.getElementById("sendBtn").disabled=false;
      });
    }
    read();
  }).catch(function(err){
    rmTyping();
    addMsg("bot","Something went sideways - let's try again! ("+err.message+")");
    document.getElementById("sendBtn").disabled=false;
  });
}

function openAdmin(){
  document.getElementById("ov").classList.add("open");
  if(!unlocked){
    document.getElementById("pw").style.display="flex";
    document.getElementById("ac").style.display="none";
    setTimeout(function(){document.getElementById("pwIn").focus();},100);
  }else{
    renderTab(activeTab);
  }
}
function closeAdmin(){document.getElementById("ov").classList.remove("open");}
function ovClick(e){if(e.target===document.getElementById("ov"))closeAdmin();}
function checkPw(){
  var v=document.getElementById("pwIn").value;
  if(v===ADMIN_PW){
    unlocked=true;
    document.getElementById("pw").style.display="none";
    var ac=document.getElementById("ac");
    ac.style.display="flex";
    ac.style.flexDirection="column";
    renderTab("r");
  }else{
    document.getElementById("pwErr").style.display="block";
    document.getElementById("pwIn").value="";
  }
}

function setTab(t,el){
  activeTab=t;
  var tabs=document.querySelectorAll(".tab");
  for(var i=0;i<tabs.length;i++)tabs[i].classList.remove("active");
  el.classList.add("active");
  renderTab(t);
}

function renderTab(t){
  var b=document.getElementById("adminBody");
  if(t==="r")renderRequests(b);
  else if(t==="m")renderManifest(b);
  else if(t==="c")renderChatLog(b);
}

function renderRequests(b){
  if(requests.length===0){
    b.innerHTML='<div class="empty">No service requests yet. Guest requests will appear here.</div>';
    return;
  }
  var html="";
  for(var i=0;i<requests.length;i++){
    var r=requests[i];
    html+='<div class="req '+r.status+'">';
    html+='<div class="req-top"><div class="req-info">';
    html+='<div class="req-type">'+r.type+'</div>';
    html+='<div class="req-guest">Cabin '+r.cabin+' - '+r.gf+' '+r.gl+'</div>';
    html+='<div class="req-time">Submitted '+r.time+' - ETA: '+r.eta+'</div>';
    html+='</div><span class="req-badge '+r.status+'">'+(r.status==="pending"?"Pending":"Resolved")+'</span></div>';
    if(r.status==="pending"){
      html+='<div class="req-actions">';
      html+='<button class="req-btn r" onclick="resolveReq('+r.id+')">Mark Resolved</button>';
      html+='<button class="req-btn d" onclick="dismissReq('+r.id+')">Dismiss</button>';
      html+='</div>';
    }
    html+='</div>';
  }
  b.innerHTML=html;
}

function resolveReq(id){
  for(var i=0;i<requests.length;i++)if(requests[i].id===id){requests[i].status="resolved";break;}
  updateBadge();
  renderRequests(document.getElementById("adminBody"));
}

function dismissReq(id){
  var n=[];
  for(var i=0;i<requests.length;i++)if(requests[i].id!==id)n.push(requests[i]);
  requests=n;
  updateBadge();
  renderRequests(document.getElementById("adminBody"));
}

function renderManifest(b){
  var html='<input class="search" id="mSearch" placeholder="Search cabin or name..." oninput="filterManifest()">';
  html+='<table class="tbl"><thead><tr><th>Cabin</th><th>First</th><th>Last</th></tr></thead><tbody id="mBody">';
  for(var c in CABINS){
    var g=CABINS[c];
    html+='<tr data-c="'+c+'" data-n="'+g.f+' '+g.l+'">';
    html+='<td>'+c+'</td><td>'+g.f+'</td><td>'+g.l+'</td></tr>';
  }
  html+='</tbody></table>';
  b.innerHTML=html;
}

function filterManifest(){
  var q=document.getElementById("mSearch").value.toLowerCase();
  var rows=document.querySelectorAll("#mBody tr");
  for(var i=0;i<rows.length;i++){
    var tr=rows[i];
    var match=tr.getAttribute("data-c").toLowerCase().indexOf(q)!==-1||tr.getAttribute("data-n").toLowerCase().indexOf(q)!==-1;
    tr.style.display=match?"":"none";
  }
}

function renderChatLog(b){
  if(chatHistory.length===0){
    b.innerHTML='<div class="empty">No messages yet.</div>';
    return;
  }
  var html="";
  for(var i=0;i<chatHistory.length;i++){
    var m=chatHistory[i];
    var bg=m.role==="user"?"#e8f0fe":"#f8f9fa";
    var col=m.role==="user"?"#014E8F":"#B61B38";
    var who=m.role==="user"?"Guest":"Captain Woolly";
    html+='<div style="margin-bottom:8px;padding:10px;background:'+bg+';border-radius:8px;border-left:3px solid '+col+'">';
    html+='<div style="font-size:11px;font-weight:700;color:'+col+';margin-bottom:3px">'+who+'</div>';
    html+='<div style="font-size:13px;white-space:pre-wrap">'+escapeHtml(m.content)+'</div>';
    html+='</div>';
  }
  b.innerHTML=html;
}

function togglePirate(){
  pirate=!pirate;
  document.getElementById("ttl").textContent=pirate?"Captain Woolly (Pirate)":"Captain Woolly";
  document.getElementById("tag").textContent=pirate?"Arrr, Choose Fun or Walk the Plank":"Choose Fun - Carnival Jubilee";
  addMsg("bot",pirate?"Ahoy! Pirate Mode activated! Ask me anything and I'll answer in the finest pirate tongue. Arr!":"Welcome back! Pirate Mode off. How can I help?");
}

function setLang(l){
  lang=l;
  var c=LANGS[l]||LANGS.en;
  document.getElementById("inp").placeholder=c.p;
  document.getElementById("status").textContent=c.s;
}

window.addEventListener("DOMContentLoaded",function(){
  setTimeout(function(){
    addMsg("bot","Ahoy and welcome aboard! I'm Captain Woolly - your AI concierge on the Carnival Jubilee.\n\nAsk me about dining, the **BOLT** roller coaster, shore excursions, entertainment, or anything onboard.\n\nNeed something for your stateroom? Just ask - towels, housekeeping, maintenance - I'll get it routed right away!");
    setChips(["Extra towels","Dining options","BOLT roller coaster","Shore excursions"]);
  },300);
});
</script>
</body>
</html>
