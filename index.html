<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#014E8F">
<title>Captain Woolly - Carnival Jubilee</title>
<style>
:root{--r:#B61B38;--b:#014E8F;--n:#002F5D;--g:#F6D003;--bg:#F0F4FA;--t:#1A1A2E;--m:#3A3A5C;--l:#7A8AAA;--pg:#C9952A;--pd:#2C1810}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--t);overflow:hidden;-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;height:100dvh;transition:background .3s}
.app.pirate{background:var(--pd)}
header{flex-shrink:0;background:var(--b);color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:0 2px 12px rgba(0,0,0,.25);z-index:10;transition:background .3s}
.app.pirate header{background:var(--pd)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:36px;height:36px;border-radius:8px;background:var(--r);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:11px;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.tt{min-width:0}
.tt h1{font-size:16px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt p{font-size:11px;color:var(--g);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.app.pirate .tt h1,.app.pirate .tt p{color:var(--pg)}
.ctrls{display:flex;align-items:center;gap:5px;flex-shrink:0}
.ctrls select,.ctrls button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;font:inherit;font-size:11px;font-weight:600;padding:6px 10px;border-radius:8px;cursor:pointer;outline:none;white-space:nowrap;transition:background .15s}
.ctrls select{padding:5px 6px}
.ctrls select option{background:var(--n);color:#fff}
.ctrls button:hover,.ctrls button:active{background:rgba(255,255,255,.28)}
.ctrls .pBtn.on{background:var(--g);color:var(--n)}
.app.pirate .ctrls .pBtn.on{background:var(--pg);color:var(--pd)}
.wave{flex-shrink:0;height:6px;background:linear-gradient(90deg,var(--r) 0%,var(--g) 50%,var(--r) 100%)}
.app.pirate .wave{background:linear-gradient(90deg,var(--pd),var(--pg),var(--pd))}
.status{flex-shrink:0;text-align:center;font-size:11px;color:var(--l);padding:5px;background:#fff;border-bottom:1px solid #e0e6f0;letter-spacing:.3px}
.app.pirate .status{background:#1a0f08;color:var(--pg);border-bottom-color:#3a2010}
.body{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.chat{flex:1;overflow-y:auto;padding:16px 12px 4px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.chat::-webkit-scrollbar{width:5px}
.chat::-webkit-scrollbar-thumb{background:#c5cfe0;border-radius:3px}
.app.pirate .chat{background:#1a0f08}
.msg{display:flex;gap:8px;max-width:100%;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.u{flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;align-self:flex-end;color:#fff;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.av.b{background:var(--r)}
.av.u{display:none}
.msg.u{padding-left:38px;justify-content:flex-end}
.app.pirate .av.b{background:var(--pg);color:var(--pd)}
.mw{min-width:0;max-width:calc(100% - 38px);display:flex;flex-direction:column}
.msg.u .mw{align-items:flex-end}
.bub{padding:11px 14px;font-size:14px;line-height:1.5;overflow-wrap:break-word;border-radius:18px;display:inline-block}
.msg.u .bub{background:var(--b);color:#fff;border-bottom-right-radius:5px}
.msg.b .bub{background:#fff;color:var(--t);border-bottom-left-radius:5px;border-left:3px solid var(--r);box-shadow:0 1px 5px rgba(0,0,0,.06)}
.app.pirate .msg.b .bub{background:#2e1c0e;border-left-color:var(--pg);color:#f5deb3}
.app.pirate .msg.u .bub{background:#5c3317;color:#f5e6c8}
.bub strong{color:var(--r)}
.app.pirate .bub strong{color:var(--pg)}
.msg.u .bub strong{color:#fff}
.card{background:#fff;border:2px solid var(--g);border-radius:12px;padding:12px 14px;margin-top:8px;font-size:12px;color:var(--m);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card .h{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--r);font-size:13px;margin-bottom:8px}
.card .h .badge{margin-left:auto;background:#28a745;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:12px}
.card .row{margin-bottom:4px}
.card .row b{color:var(--t);display:inline-block;min-width:50px}
.app.pirate .card{background:#2e1c0e;color:#f5deb3;border-color:var(--pg)}
.app.pirate .card .row b{color:#f5e6c8}
.chips{flex-shrink:0;display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px 0}
.chip{background:#fff;border:1.5px solid var(--b);color:var(--b);border-radius:18px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font:inherit;font-weight:600;white-space:nowrap;transition:all .12s}
.chip:hover,.chip:active{background:var(--b);color:#fff;transform:translateY(-1px)}
.app.pirate .chip{background:transparent;border-color:var(--pg);color:var(--pg)}
.app.pirate .chip:hover,.app.pirate .chip:active{background:var(--pg);color:var(--pd)}
.typ{display:inline-flex;gap:5px;padding:13px 16px;background:#fff;border-left:3px solid var(--r);border-radius:18px;border-bottom-left-radius:5px;box-shadow:0 1px 5px rgba(0,0,0,.06)}
.dot{width:7px;height:7px;background:var(--r);border-radius:50%;animation:bn 1.3s infinite}
.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}
@keyframes bn{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-7px)}}
.app.pirate .typ{background:#2e1c0e;border-left-color:var(--pg)}
.app.pirate .dot{background:var(--pg)}
.input{flex-shrink:0;background:#fff;border-top:1px solid #dde4f0;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.app.pirate .input{background:var(--pd);border-top-color:#3a2010}
.row{display:flex;gap:8px;align-items:flex-end}
.box{flex:1;min-height:44px;max-height:120px;border:1.5px solid #c0cbde;border-radius:22px;padding:11px 16px;font-size:16px;font-family:inherit;resize:none;outline:none;line-height:1.4;background:var(--bg);transition:border-color .2s}
.box:focus{border-color:var(--b);background:#fff}
.app.pirate .box{background:#2e1c0e;border-color:var(--pg);color:#f5deb3}
.app.pirate .box::placeholder{color:rgba(201,149,42,.5)}
.snd{width:44px;height:44px;border-radius:50%;background:var(--r);border:0;cursor:pointer;color:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;box-shadow:0 2px 6px rgba(182,27,56,.3)}
.snd:hover{background:#E8192C;transform:scale(1.05)}
.snd:active{transform:scale(.95)}
.snd:disabled{background:#c5cfe0;cursor:not-allowed;box-shadow:none;transform:none}
.snd svg{width:20px;height:20px}
.ovr{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(4px)}
.ovr.on{display:flex}
.pnl{background:#fff;border-radius:16px;width:100%;max-width:760px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.ph{background:var(--n);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.ph h2{font-size:15px;font-weight:700}
.x{background:rgba(255,255,255,.15);border:0;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.x:hover{background:rgba(255,255,255,.28)}
.tabs{display:flex;border-bottom:2px solid #eee;overflow-x:auto;flex-shrink:0}
.tab{padding:11px 18px;font-size:13px;font-weight:600;color:var(--l);cursor:pointer;border:0;background:none;border-bottom:2px solid transparent;font:inherit;font-weight:600;white-space:nowrap;transition:all .15s}
.tab.on{color:var(--r);border-bottom-color:var(--r)}
.pb{flex:1;overflow-y:auto;padding:16px}
.pw{display:flex;flex-direction:column;gap:14px;align-items:center;padding:48px 20px}
.pw .ico{font-size:42px}
.pw h3{font-size:16px;color:var(--t)}
.pw input{border:1.5px solid #c0cbde;border-radius:10px;padding:12px;font-size:15px;outline:none;text-align:center;letter-spacing:4px;width:240px;font:inherit}
.pw input:focus{border-color:var(--b)}
.pw button{background:var(--b);color:#fff;border:0;border-radius:10px;padding:11px 32px;font-weight:700;cursor:pointer;font:inherit;font-weight:700}
.pw .err{color:var(--r);font-size:13px;display:none}
.req{border:1px solid #e0e6f0;border-radius:12px;padding:14px;margin-bottom:10px;background:#fff;transition:all .15s}
.req.p{border-left:4px solid var(--g)}
.req.r{border-left:4px solid #28a745;opacity:.65}
.rt{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ri{flex:1;min-width:0}
.ri .typ{font-size:14px;font-weight:700;color:var(--t);background:none;border:0;padding:0;display:block;box-shadow:none}
.ri .gst{font-size:12px;color:var(--m);margin-top:2px}
.ri .tm{font-size:11px;color:var(--l);margin-top:3px}
.bd{font-size:10px;font-weight:700;padding:4px 10px;border-radius:18px;white-space:nowrap}
.bd.p{background:#fff3cd;color:#856404}
.bd.r{background:#d1f5dc;color:#155724}
.acts{margin-top:10px;display:flex;gap:6px}
.acts button{border:0;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;font:inherit;font-weight:600;transition:all .15s}
.acts .res{background:#28a745;color:#fff}
.acts .res:hover{background:#218838}
.acts .dis{background:#f0f4fa;color:var(--m)}
.acts .dis:hover{background:#dde4f0}
.empty{text-align:center;padding:48px 20px;color:var(--l);font-size:14px}
.empty .ic{font-size:42px;margin-bottom:10px;opacity:.5}
.srch{border:1.5px solid #c0cbde;border-radius:10px;padding:10px 14px;font-size:14px;outline:none;width:100%;margin-bottom:12px;font:inherit}
.srch:focus{border-color:var(--b)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--n);color:#fff;padding:9px 12px;text-align:left;font-size:12px;font-weight:700;letter-spacing:.3px}
.tbl th:first-child{border-top-left-radius:8px}
.tbl th:last-child{border-top-right-radius:8px}
.tbl td{padding:8px 12px;border-bottom:1px solid #eee}
.tbl tr:nth-child(even) td{background:var(--bg)}
.tbl tr:hover td{background:#e8f0fe}
.cl{margin-bottom:10px;padding:11px 14px;border-radius:10px;border-left:3px solid}
.cl.u{background:#e8f0fe;border-left-color:var(--b)}
.cl.b{background:#f8f9fa;border-left-color:var(--r)}
.cl .who{font-size:11px;font-weight:700;margin-bottom:4px}
.cl.u .who{color:var(--b)}
.cl.b .who{color:var(--r)}
.cl .ct{font-size:13px;color:#333;white-space:pre-wrap;word-break:break-word}
@media(min-width:768px){header{padding:12px 20px}.tt h1{font-size:17px}.chat{padding:20px;max-width:840px;margin:0 auto;width:100%}.chips{padding:10px 20px 0;max-width:840px;margin:0 auto;width:100%}.input{padding:14px 20px;padding-bottom:14px}.row{max-width:800px;margin:0 auto}.bub{font-size:15px;max-width:75%}}
@media(min-width:1024px){.body{background:#e4ebf5}.chat{background:var(--bg);border-radius:14px;margin:14px auto;padding:24px 28px;box-shadow:0 2px 14px rgba(0,0,0,.06)}.app.pirate .body{background:#0a0503}.app.pirate .chat{background:#1a0f08}}
@media(max-width:380px){.tt p{display:none}.ctrls .lbl{display:none}}
</style>
</head>
<body>
<div class="app" id="app">
<header>
  <div class="brand">
    <div class="logo">CCL</div>
    <div class="tt"><h1 id="ttl">Captain Woolly</h1><p id="tag">Choose Fun - Carnival Jubilee</p></div>
  </div>
  <div class="ctrls">
    <select id="lang" onchange="setLang(this.value)" aria-label="Language">
      <option value="en">EN</option><option value="es">ES</option><option value="fr">FR</option><option value="de">DE</option><option value="it">IT</option><option value="pt">PT</option><option value="zh">ZH</option>
    </select>
    <button onclick="openAdmin()"><span class="lbl">Admin</span><span style="display:none">A</span></button>
    <button class="pBtn" id="pBtn" onclick="togglePirate()" title="Pirate Mode">P</button>
  </div>
</header>
<div class="wave"></div>
<div class="status" id="status">Carnival Jubilee - Western Caribbean</div>
<div class="body">
  <div class="chat" id="chat"></div>
  <div class="chips" id="chips"></div>
</div>
<div class="input">
  <div class="row">
    <textarea class="box" id="inp" placeholder="Ask Captain Woolly anything..." rows="1" onkeydown="onKey(event)" oninput="resize(this)"></textarea>
    <button class="snd" id="snd" onclick="send()" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>
</div>

<div class="ovr" id="ovr" onclick="ovrClick(event)">
  <div class="pnl">
    <div class="ph"><h2>Captain Woolly - Admin</h2><button class="x" onclick="closeAdmin()">&times;</button></div>
    <div class="pw" id="pw">
      <div class="ico">&#128274;</div>
      <h3>Admin Access</h3>
      <input type="password" id="pwIn" placeholder="......" onkeydown="if(event.key==='Enter')checkPw()" autocomplete="off">
      <button onclick="checkPw()">Enter</button>
      <span class="err" id="pwErr">Incorrect password</span>
    </div>
    <div id="ac" style="display:none;flex:1;overflow:hidden;flex-direction:column">
      <div class="tabs">
        <button class="tab on" onclick="setTab('r',this)">Requests <span id="bdg"></span></button>
        <button class="tab" onclick="setTab('m',this)">Manifest</button>
        <button class="tab" onclick="setTab('c',this)">Chat Log</button>
      </div>
      <div class="pb" id="pBody"></div>
    </div>
  </div>
</div>

<script>
var CABINS={"1001L":{f:"Betty",l:"Flores"},"1006":{f:"Melissa",l:"Johnson"},"1011L":{f:"Katherine",l:"Scott"},"1071":{f:"Kathleen",l:"Wright"},"1081R":{f:"Helen",l:"Martinez"},"1082L":{f:"Raymond",l:"Allen"},"1115R":{f:"David",l:"Bennett"},"1129L":{f:"Nancy",l:"Cook"},"1140L":{f:"Jeffrey",l:"Turner"},"1199":{f:"Samantha",l:"Davis"},"1205":{f:"David",l:"Flores"},"1221":{f:"Brian",l:"James"},"1229":{f:"Eric",l:"Collins"},"1235":{f:"Charles",l:"Carter"},"1235L":{f:"Nicholas",l:"Thomas"},"1244R":{f:"Kenneth",l:"Hernandez"},"1249":{f:"Barbara",l:"Gray"},"1275":{f:"Carolyn",l:"White"},"1277":{f:"Thomas",l:"Nelson"},"1283":{f:"Kevin",l:"Taylor"},"1403":{f:"Eric",l:"Brooks"},"1412":{f:"Thomas",l:"Taylor"},"1482R":{f:"Anna",l:"Hill"},"672L":{f:"Dorothy",l:"Long"},"677R":{f:"Christine",l:"Adams"},"685L":{f:"Pamela",l:"Rivera"},"693R":{f:"Nancy",l:"Rodriguez"},"704R":{f:"Sandra",l:"Edwards"},"712":{f:"Carolyn",l:"Watson"},"720L":{f:"Nancy",l:"Johnson"},"728L":{f:"William",l:"Turner"},"746R":{f:"Steven",l:"Anderson"},"749":{f:"Emma",l:"Rivera"},"749R":{f:"James",l:"Myers"},"778L":{f:"Rachel",l:"Torres"},"787":{f:"Christopher",l:"Rodriguez"},"788R":{f:"Frank",l:"Diaz"},"828R":{f:"Rachel",l:"Wright"},"834L":{f:"Dorothy",l:"Ramirez"},"848L":{f:"Ryan",l:"Smith"},"848R":{f:"Angela",l:"Diaz"},"865":{f:"Brandon",l:"Martin"},"905R":{f:"Gregory",l:"Gomez"},"921":{f:"Karen",l:"Collins"},"929L":{f:"Eric",l:"Williams"},"973R":{f:"Jessica",l:"Foster"},"984":{f:"Christopher",l:"Nguyen"},"986R":{f:"Jeffrey",l:"Gray"},"991":{f:"William",l:"Flores"},"996R":{f:"Sarah",l:"White"}};
var SVCS={towels:["Extra Towels","Housekeeping","15-20 minutes"],towel:["Extra Towels","Housekeeping","15-20 minutes"],sheets:["Fresh Sheets","Housekeeping","20-30 minutes"],blanket:["Extra Blanket","Housekeeping","15-20 minutes"],pillow:["Extra Pillow","Housekeeping","15-20 minutes"],housekeep:["Housekeeping","Housekeeping","20-30 minutes"],clean:["Stateroom Cleaning","Housekeeping","20-30 minutes"],broken:["Maintenance Request","Maintenance","30-45 minutes"],fix:["Maintenance Request","Maintenance","30-45 minutes"],repair:["Maintenance Request","Maintenance","30-45 minutes"],leak:["Plumbing Issue","Maintenance","20-30 minutes"],toilet:["Bathroom Issue","Maintenance","20-30 minutes"],ac:["AC Issue","Maintenance","30-45 minutes"],heat:["Temperature Issue","Maintenance","30-45 minutes"],noise:["Noise Complaint","Guest Services","15-20 minutes"],ice:["Ice Bucket","Housekeeping","10-15 minutes"],toiletries:["Toiletry Restock","Housekeeping","15-20 minutes"],soap:["Toiletry Restock","Housekeeping","15-20 minutes"],shampoo:["Toiletry Restock","Housekeeping","15-20 minutes"]};
var lang="en",pirate=false,chatHistory=[],pending=null,reqs=[],unlocked=false,curTab="r";
var PW="Ron";
var L={en:["Ask Captain Woolly anything...","Carnival Jubilee - Western Caribbean","English"],es:["Preguntale al Capitan Woolly...","Carnival Jubilee - Caribe Occidental","Spanish"],fr:["Demandez au Capitaine Woolly...","Carnival Jubilee - Caraibes","French"],de:["Fragen Sie Kapitan Woolly...","Carnival Jubilee - Karibik","German"],it:["Chiedi al Capitano Woolly...","Carnival Jubilee - Caraibi","Italian"],pt:["Pergunte ao Capitao Woolly...","Carnival Jubilee - Caribe","Portuguese"],zh:["Wen Woolly Chuan Zhang...","Carnival Jubilee","Chinese"]};

function $(id){return document.getElementById(id);}
function tm(){return new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmt(t){return esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\n/g,"<br>");}
function resize(el){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,120)+"px";}
function onKey(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}
function scroll(){var c=$("chat");setTimeout(function(){c.scrollTop=c.scrollHeight;},30);}
function detect(t){var l=t.toLowerCase();for(var k in SVCS)if(l.indexOf(k)!==-1)return SVCS[k];return null;}

function addMsg(role,content,extra){
  var c=$("chat");
  var d=document.createElement("div");
  d.className="msg "+(role==="user"?"u":"b");
  var av=role==="user"?"U":"W";
  var ac=role==="user"?"u":"b";
  var h='<div class="av '+ac+'">'+av+'</div><div class="mw"><div class="bub">'+fmt(content)+'</div>';
  if(extra)h+=extra;
  h+="</div>";
  d.innerHTML=h;
  c.appendChild(d);
  scroll();
}

function addTyping(){
  var c=$("chat");
  var d=document.createElement("div");
  d.className="msg b";
  d.id="ti";
  d.innerHTML='<div class="av b">W</div><div class="typ"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  c.appendChild(d);
  scroll();
}
function rmTyping(){var t=$("ti");if(t)t.remove();}

function setChips(arr){
  var c=$("chips");
  c.innerHTML="";
  arr.forEach(function(label){
    var b=document.createElement("button");
    b.className="chip";
    b.textContent=label;
    b.onclick=function(){c.innerHTML="";send(label);};
    c.appendChild(b);
  });
}

function buildCard(svc,cabin,g){
  return '<div class="card"><div class="h">'+svc[0]+'<span class="badge">SUBMITTED</span></div>'+
    '<div class="row"><b>Cabin:</b> '+cabin+'</div>'+
    '<div class="row"><b>Guest:</b> '+g.f+' '+g.l+'</div>'+
    '<div class="row"><b>Team:</b> '+svc[1]+'</div>'+
    '<div class="row"><b>ETA:</b> '+svc[2]+'</div></div>';
}

function submitReq(svc,cabin,g){
  reqs.unshift({id:Date.now(),type:svc[0],cat:svc[1],eta:svc[2],cabin:cabin,gf:g.f,gl:g.l,time:tm(),status:"p"});
  updateBadge();
}

function updateBadge(){
  var n=reqs.filter(function(r){return r.status==="p";}).length;
  var b=$("bdg");if(b)b.textContent=n>0?"("+n+")":"";
}

function buildSys(){
  var p="You are Captain Woolly, the cheerful AI concierge aboard the Carnival Jubilee, Carnival Cruise Line's Excel-class ship homeported in Galveston, Texas. ";
  p+="She sails 7-night Western Caribbean itineraries to Cozumel, Roatan, Belize City, and Costa Maya. ";
  p+="Key features: BOLT roller coaster at sea, Emeril's Bistro 1396, Big Chicken by Shaq, Punchliner Comedy Club, Piano Bar 88, Havana Bar, WaterWorks aqua park, Cloud 9 Spa, Serenity adults-only deck, Casino, Ji Ji Asian Kitchen, Bonsai Sushi, Steakhouse, Cucina del Capitano. ";
  p+="Style: Use 'Carnival Cruise Line' (not Lines), 'guests' (not passengers), 'staterooms' (not rooms). Match the Choose Fun energy - warm, fun, enthusiastic. Keep responses concise (2-4 sentences typical). ";
  if(pirate)p+="PIRATE MODE: Respond in pirate speak with Arr, Ahoy, matey, etc. ";
  if(lang!=="en")p+="Respond in "+L[lang][2]+". ";
  return p;
}

function send(override){
  var box=$("inp"),text=(override||box.value).trim();
  if(!text)return;
  if(!override){box.value="";box.style.height="auto";}
  $("chips").innerHTML="";
  $("snd").disabled=true;
  addMsg("user",text);
  chatHistory.push({role:"user",content:text});

  if(pending&&pending.waiting){
    var key=text.toUpperCase().replace(/\s/g,""),g=CABINS[key];
    if(g){
      var svc=pending.svc;
      submitReq(svc,key,g);
      var card=buildCard(svc,key,g);
      var sal=(g.l.charAt(g.l.length-1)==="s"?"Ms.":"Mr.")+" "+g.l;
      var msg="Thank you, "+sal+"! Your request for **"+svc[0]+"** has been sent to our "+svc[1]+" team and will arrive within **"+svc[2]+"**. Anything else I can help with?";
      addMsg("b",msg,card);chatHistory.push({role:"assistant",content:msg});
      pending=null;
      setChips(["Dining options","Entertainment tonight","Shore excursions","Spa booking"]);
      $("snd").disabled=false;return;
    }
    var looksLikeCabin=/^[0-9]{2,4}[LR]?$/i.test(key)&&key.length<=5;
    if(looksLikeCabin){
      var nf="I'm sorry, I couldn't find cabin "+text+". Could you double-check the number? You can find it on your key card or in the Carnival HUB app. Or feel free to ask me something else!";
      addMsg("b",nf);chatHistory.push({role:"assistant",content:nf});
      $("snd").disabled=false;return;
    }
    pending=null;
  }

  var d=detect(text);
  if(d){
    pending={svc:d,waiting:true};
    var ask="Of course! I'll get that arranged for you right away.\n\nCould you please provide your **cabin number**? You can find it on your key card or in the Carnival HUB app.";
    addMsg("b",ask);chatHistory.push({role:"assistant",content:ask});
    $("snd").disabled=false;return;
  }

  callAI();
}

function callAI(){
  addTyping();
  var msgs=chatHistory.map(function(m){return{role:m.role,content:m.content};});
  fetch("/api/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:1000,stream:true,system:buildSys(),messages:msgs})
  }).then(function(r){
    if(!r.ok)throw new Error("API "+r.status);
    rmTyping();
    var c=$("chat"),d=document.createElement("div");
    d.className="msg b";
    d.innerHTML='<div class="av b">W</div><div class="mw"><div class="bub" id="sb"></div></div>';
    c.appendChild(d);scroll();
    var bub=$("sb"),reader=r.body.getReader(),dec=new TextDecoder(),full="";
    function read(){
      reader.read().then(function(res){
        if(res.done){
          bub.removeAttribute("id");
          chatHistory.push({role:"assistant",content:full});
          setChips(["What's for dinner?","BOLT roller coaster","Today's port","Spa hours"]);
          $("snd").disabled=false;return;
        }
        var ck=dec.decode(res.value,{stream:true}),lines=ck.split("\n");
        for(var i=0;i<lines.length;i++){
          var ln=lines[i];
          if(ln.indexOf("data:")!==0)continue;
          var dt=ln.slice(5).trim();
          if(dt==="[DONE]")continue;
          try{
            var ev=JSON.parse(dt);
            if(ev.type==="content_block_delta"&&ev.delta&&ev.delta.text){
              full+=ev.delta.text;bub.innerHTML=fmt(full);scroll();
            }
          }catch(e){}
        }
        read();
      }).catch(function(e){
        rmTyping();addMsg("b","Something went sideways - let's try again! ("+e.message+")");
        $("snd").disabled=false;
      });
    }
    read();
  }).catch(function(e){
    rmTyping();addMsg("b","Something went sideways - let's try again! ("+e.message+")");
    $("snd").disabled=false;
  });
}

function openAdmin(){
  $("ovr").classList.add("on");
  if(!unlocked){
    $("pw").style.display="flex";
    $("ac").style.display="none";
    setTimeout(function(){$("pwIn").focus();},100);
  }else renderTab(curTab);
}
function closeAdmin(){$("ovr").classList.remove("on");}
function ovrClick(e){if(e.target===$("ovr"))closeAdmin();}
function checkPw(){
  if($("pwIn").value===PW){
    unlocked=true;
    $("pw").style.display="none";
    var ac=$("ac");ac.style.display="flex";ac.style.flexDirection="column";
    renderTab("r");
  }else{$("pwErr").style.display="block";$("pwIn").value="";}
}

function setTab(t,el){
  curTab=t;
  document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("on");});
  el.classList.add("on");
  renderTab(t);
}

function renderTab(t){
  var b=$("pBody");
  if(t==="r")renderReqs(b);
  else if(t==="m")renderMan(b);
  else if(t==="c")renderChatLog(b);
}

function renderReqs(b){
  if(!reqs.length){b.innerHTML='<div class="empty"><div class="ic">&#128276;</div>No service requests yet.<br>Guest requests will appear here.</div>';return;}
  b.innerHTML=reqs.map(function(r){
    var h='<div class="req '+r.status+'"><div class="rt"><div class="ri">'+
      '<div class="typ">'+r.type+'</div>'+
      '<div class="gst">Cabin '+r.cabin+' - '+r.gf+' '+r.gl+'</div>'+
      '<div class="tm">Submitted '+r.time+' - ETA: '+r.eta+'</div></div>'+
      '<span class="bd '+r.status+'">'+(r.status==="p"?"Pending":"Resolved")+'</span></div>';
    if(r.status==="p")h+='<div class="acts"><button class="res" onclick="resolveReq('+r.id+')">Mark Resolved</button><button class="dis" onclick="dismissReq('+r.id+')">Dismiss</button></div>';
    h+="</div>";return h;
  }).join("");
}
function resolveReq(id){reqs.forEach(function(r){if(r.id===id)r.status="r";});updateBadge();renderReqs($("pBody"));}
function dismissReq(id){reqs=reqs.filter(function(r){return r.id!==id;});updateBadge();renderReqs($("pBody"));}

function renderMan(b){
  var h='<input class="srch" id="ms" placeholder="Search cabin or name..." oninput="filterMan()">'+
    '<table class="tbl"><thead><tr><th>Cabin</th><th>First Name</th><th>Last Name</th></tr></thead><tbody id="mb">';
  for(var c in CABINS){var g=CABINS[c];h+='<tr data-c="'+c+'" data-n="'+g.f+' '+g.l+'"><td>'+c+'</td><td>'+g.f+'</td><td>'+g.l+'</td></tr>';}
  h+="</tbody></table>";b.innerHTML=h;
}
function filterMan(){
  var q=$("ms").value.toLowerCase();
  document.querySelectorAll("#mb tr").forEach(function(tr){
    var m=tr.getAttribute("data-c").toLowerCase().indexOf(q)!==-1||tr.getAttribute("data-n").toLowerCase().indexOf(q)!==-1;
    tr.style.display=m?"":"none";
  });
}

function renderChatLog(b){
  if(!chatHistory.length){b.innerHTML='<div class="empty"><div class="ic">&#128172;</div>No messages yet.</div>';return;}
  b.innerHTML=chatHistory.map(function(m){
    var who=m.role==="user"?"Guest":"Captain Woolly",cls=m.role==="user"?"u":"b";
    return '<div class="cl '+cls+'"><div class="who">'+who+'</div><div class="ct">'+esc(m.content)+'</div></div>';
  }).join("");
}

function togglePirate(){
  pirate=!pirate;
  $("app").classList.toggle("pirate",pirate);
  $("pBtn").classList.toggle("on",pirate);
  $("ttl").textContent=pirate?"Captain Woolly":"Captain Woolly";
  $("tag").textContent=pirate?"Arrr, Choose Fun or Walk the Plank":"Choose Fun - Carnival Jubilee";
  addMsg("b",pirate?"Ahoy, matey! Pirate Mode activated! Ask me anything and I'll answer in the finest pirate tongue. Arr!":"Welcome back! Pirate Mode off. How can I help?");
}

function setLang(l){
  lang=l;var c=L[l]||L.en;
  $("inp").placeholder=c[0];$("status").textContent=c[1];
}

window.addEventListener("DOMContentLoaded",function(){
  setTimeout(function(){
    addMsg("b","Ahoy and welcome aboard! I'm Captain Woolly - your AI concierge on the Carnival Jubilee.\n\nAsk me about dining, the **BOLT** roller coaster, shore excursions, entertainment, or anything onboard.\n\nNeed something for your stateroom? Just ask - towels, housekeeping, maintenance - I'll get it routed right away!");
    setChips(["Extra towels","Dining options","BOLT roller coaster","Shore excursions"]);
  },300);
});
</script>
