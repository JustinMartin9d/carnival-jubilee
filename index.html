<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Captain Woolly – Carnival Jubilee AI Concierge</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--carnival-red:#B61B38;--carnival-blue:#014E8F;--carnival-navy:#002F5D;--carnival-bright:#E8192C;--carnival-gold:#F6D003;--carnival-light:#F0F4FA;--text-dark:#1A1A2E;--text-mid:#3A3A5C;--text-light:#7A8AAA;--pirate-gold:#C9952A;--pirate-dark:#2C1810;--header-h:70px;--wave-h:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{height:100%;overflow:hidden;font-family:'Poppins',sans-serif;background:var(--carnival-light);color:var(--text-dark)}
.app{display:flex;flex-direction:column;height:100%;height:100dvh;overflow:hidden;transition:background .4s}
.header{flex-shrink:0;height:var(--header-h);background:var(--carnival-blue);display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:10px;box-shadow:0 2px 12px rgba(0,0,0,.25);z-index:20}
.header-brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.funnel-svg{width:38px;height:38px;flex-shrink:0}
.header-text{min-width:0}
.header-text h1{font-size:clamp(15px,3.5vw,20px);font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.header-text .tagline{font-size:clamp(10px,2.2vw,13px);color:var(--carnival-gold);font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.lang-select{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:12px;padding:5px 6px;border-radius:8px;cursor:pointer;font-family:inherit;outline:none}
.lang-select option{background:var(--carnival-navy);color:#fff}
.admin-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.8);font-size:11px;font-weight:600;padding:5px 10px;border-radius:8px;cursor:pointer;transition:all .2s;white-space:nowrap}
.admin-btn:hover{background:rgba(255,255,255,.22);color:#fff}
.pirate-toggle{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;cursor:pointer;padding:5px 8px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;transition:all .2s;white-space:nowrap}
.pirate-toggle .toggle-track{width:28px;height:14px;background:rgba(255,255,255,.2);border-radius:7px;position:relative;transition:background .3s}
.pirate-toggle .toggle-knob{width:10px;height:10px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:left .3s}
.pirate-toggle.on .toggle-track{background:var(--pirate-gold)}
.pirate-toggle.on .toggle-knob{left:16px}
@media(max-width:480px){.pirate-toggle span:first-child{display:none}}
.wave-band{flex-shrink:0;height:var(--wave-h);background:var(--carnival-blue);overflow:hidden}
.wave-band svg{width:100%;height:100%;display:block}
.chat-body{flex:1;min-height:0;background:var(--carnival-light);display:flex;flex-direction:column;overflow:hidden}
.messages{flex:1;overflow-y:auto;padding:16px 12px 8px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.messages::-webkit-scrollbar{width:4px}
.messages::-webkit-scrollbar-thumb{background:#c5cfe0;border-radius:2px}
.status-bar{flex-shrink:0;text-align:center;font-size:10px;color:var(--text-light);padding:3px 0 4px;border-bottom:1px solid #e0e6f0;letter-spacing:.3px}
.msg{display:flex;gap:8px;max-width:100%}
.msg.user{flex-direction:row-reverse}
.msg.user .bubble{background:var(--carnival-blue);color:#fff;border-radius:18px 18px 4px 18px;margin-left:auto}
.msg.nora .bubble{background:#fff;color:var(--text-dark);border-radius:4px 18px 18px 18px;border-left:3px solid var(--carnival-red);box-shadow:0 1px 6px rgba(0,0,0,.07)}
.bubble{padding:10px 14px;font-size:clamp(13px,3.5vw,15px);line-height:1.55;max-width:min(85%,520px);word-break:break-word}
.bubble p{margin-bottom:6px}
.bubble p:last-child{margin-bottom:0}
.msg-time{font-size:10px;color:var(--text-light);align-self:flex-end;white-space:nowrap;margin-bottom:2px}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;align-self:flex-end}
.avatar.nora-av{background:var(--carnival-red)}
.avatar.user-av{background:var(--carnival-blue)}
.service-card{background:#fff;border:2px solid var(--carnival-gold);border-radius:12px;padding:12px 14px;margin-top:4px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.service-card .sc-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.service-card .sc-icon{font-size:22px}
.service-card .sc-title{font-size:13px;font-weight:700;color:var(--carnival-red)}
.service-card .sc-badge{font-size:10px;font-weight:700;background:#28a745;color:#fff;border-radius:20px;padding:2px 8px;margin-left:auto}
.service-card .sc-row{font-size:12px;color:var(--text-mid);margin-bottom:3px}
.service-card .sc-row strong{color:var(--text-dark)}
.service-card .sc-eta{font-size:11px;font-style:italic;color:var(--text-light);margin-top:6px}
.quick-replies{display:flex;flex-wrap:wrap;gap:6px;padding:6px 12px 2px}
.qr-chip{background:#fff;border:1.5px solid var(--carnival-blue);color:var(--carnival-blue);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:inherit}
.qr-chip:hover,.qr-chip:active{background:var(--carnival-blue);color:#fff}
.typing-dots{background:#fff;border-left:3px solid var(--carnival-red);border-radius:4px 18px 18px 18px;padding:12px 16px;display:inline-flex;gap:5px;align-items:center;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--carnival-red);animation:bounce 1.3s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-7px)}}
.input-section{flex-shrink:0;background:#fff;border-top:1px solid #dde4f0;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.input-row{display:flex;gap:8px;align-items:flex-end}
.input-box{flex:1;min-height:42px;max-height:120px;border:1.5px solid #c0cbde;border-radius:22px;padding:10px 16px;font-size:15px;font-family:inherit;resize:none;outline:none;line-height:1.4;transition:border-color .2s;overflow-y:auto;background:var(--carnival-light)}
.input-box:focus{border-color:var(--carnival-blue);background:#fff}
.send-btn{width:42px;height:42px;border-radius:50%;flex-shrink:0;background:var(--carnival-red);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .1s;color:#fff}
.send-btn:hover{background:var(--carnival-bright)}
.send-btn:active{transform:scale(.93)}
.send-btn svg{width:18px;height:18px}
.send-btn:disabled{background:#c5cfe0;cursor:not-allowed}
.upload-area{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.upload-pill{display:none;align-items:center;gap:5px;background:#e8f0fe;border:1px solid #92a7d4;border-radius:20px;padding:3px 10px;font-size:11px;color:var(--carnival-blue)}
.upload-pill.show{display:flex}
.upload-btn{background:none;border:none;color:var(--text-light);cursor:pointer;font-size:18px;line-height:1;padding:2px}
.upload-btn:hover{color:var(--carnival-blue)}
.admin-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;padding:12px}
.admin-overlay.open{display:flex}
.admin-panel{background:#fff;border-radius:16px;width:100%;max-width:720px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.admin-header{background:var(--carnival-navy);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.admin-header h2{font-size:16px;font-weight:700}
.admin-close{background:rgba(255,255,255,.15);border:none;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.admin-tabs{display:flex;border-bottom:2px solid #eee;flex-shrink:0;overflow-x:auto}
.admin-tab{padding:10px 18px;font-size:13px;font-weight:600;color:var(--text-light);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.admin-tab.active{color:var(--carnival-red);border-bottom-color:var(--carnival-red)}
.admin-body{flex:1;overflow-y:auto;padding:16px}
.admin-pw-screen{display:flex;flex-direction:column;gap:12px;align-items:center;padding:40px 20px}
.admin-pw-screen h3{font-size:16px;color:var(--text-dark)}
.admin-pw-input{border:1.5px solid #c0cbde;border-radius:10px;padding:10px 16px;font-size:15px;font-family:inherit;outline:none;width:100%;max-width:260px;text-align:center;letter-spacing:3px}
.admin-pw-input:focus{border-color:var(--carnival-blue)}
.admin-pw-btn{background:var(--carnival-blue);color:#fff;border:none;border-radius:10px;padding:10px 28px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.admin-pw-error{color:var(--carnival-red);font-size:13px;display:none}
.req-card{border:1px solid #e0e6f0;border-radius:12px;padding:14px;margin-bottom:10px;position:relative;transition:border-color .2s}
.req-card.pending{border-left:4px solid var(--carnival-gold)}
.req-card.resolved{border-left:4px solid #28a745;opacity:.7}
.req-card-top{display:flex;align-items:flex-start;gap:10px}
.req-icon{font-size:24px;flex-shrink:0}
.req-info{flex:1;min-width:0}
.req-type{font-size:13px;font-weight:700;color:var(--text-dark)}
.req-guest{font-size:12px;color:var(--text-mid)}
.req-time{font-size:11px;color:var(--text-light)}
.req-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.req-badge.pending{background:#fff3cd;color:#856404}
.req-badge.resolved{background:#d1f5dc;color:#155724}
.req-actions{margin-top:10px;display:flex;gap:8px}
.req-btn{border:none;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.req-btn.resolve{background:#28a745;color:#fff}
.req-btn.resolve:hover{background:#218838}
.req-btn.dismiss{background:#f0f4fa;color:var(--text-mid)}
.req-btn.dismiss:hover{background:#dde4f0}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-light);font-size:14px}
.empty-state .es-icon{font-size:40px;margin-bottom:10px}
.manifest-search{border:1.5px solid #c0cbde;border-radius:10px;padding:8px 14px;font-size:14px;font-family:inherit;outline:none;width:100%;margin-bottom:12px}
.manifest-search:focus{border-color:var(--carnival-blue)}
.manifest-table{width:100%;border-collapse:collapse;font-size:13px}
.manifest-table th{background:var(--carnival-navy);color:#fff;padding:8px 12px;text-align:left;font-size:12px}
.manifest-table td{padding:8px 12px;border-bottom:1px solid #eee}
.manifest-table tr:nth-child(even) td{background:var(--carnival-light)}
.manifest-table tr:hover td{background:#e8f0fe}
.app.pirate-mode{background:var(--pirate-dark)}
.app.pirate-mode .header{background:var(--pirate-dark)}
.app.pirate-mode .header-text h1,.app.pirate-mode .header-text .tagline{color:var(--pirate-gold)}
.app.pirate-mode .wave-band{background:var(--pirate-dark)}
.app.pirate-mode .chat-body{background:#1a0f08}
.app.pirate-mode .status-bar{background:#1a0f08;color:var(--pirate-gold);border-bottom-color:#3a2010}
.app.pirate-mode .msg.nora .bubble{background:#2e1c0e;border-left-color:var(--pirate-gold);color:#f5deb3}
.app.pirate-mode .msg.user .bubble{background:#5c3317;color:#f5e6c8}
.app.pirate-mode .typing-dots{background:#2e1c0e;border-left-color:var(--pirate-gold)}
.app.pirate-mode .dot{background:var(--pirate-gold)}
.app.pirate-mode .input-section{background:var(--pirate-dark);border-top-color:#3a2010}
.app.pirate-mode .input-box{background:#2e1c0e;border-color:var(--pirate-gold);color:#f5deb3}
.app.pirate-mode .input-box::placeholder{color:rgba(201,149,42,.5)}
.app.pirate-mode .qr-chip{border-color:var(--pirate-gold);color:var(--pirate-gold);background:transparent}
.app.pirate-mode .qr-chip:hover{background:var(--pirate-gold);color:var(--pirate-dark)}
@media(max-width:480px){:root{--header-h:58px}.header{padding:0 10px;gap:6px}.funnel-svg{width:32px;height:32px}.lang-select{font-size:11px;padding:4px 5px}.admin-btn{font-size:10px;padding:4px 8px}.bubble{font-size:14px;max-width:88%}.messages{padding:12px 8px 6px;gap:10px}.input-box{font-size:16px}.input-section{padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom))}}
@media(min-width:768px){.messages{padding:20px 20px 10px;max-width:800px;margin:0 auto;width:100%}.quick-replies{padding:6px 20px 2px;max-width:800px;margin:0 auto}.input-section{padding:12px 20px;padding-bottom:12px}.input-row{max-width:760px;margin:0 auto}.bubble{font-size:15px}}
@media(min-width:1024px){.chat-body{background:#e4ebf5}.messages{background:var(--carnival-light);border-radius:12px;margin:12px auto;padding:20px 24px;box-shadow:0 2px 12px rgba(0,0,0,.06)}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="header">
  <div class="header-brand">
    <svg class="funnel-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect x="5" y="70" width="90" height="22" rx="4" fill="#014E8F"/>
      <rect x="35" y="25" width="30" height="48" rx="3" fill="#014E8F"/>
      <rect x="35" y="38" width="30" height="10" fill="#B61B38"/>
      <rect x="35" y="48" width="30" height="6" fill="#fff"/>
      <rect x="32" y="18" width="36" height="10" rx="3" fill="#B61B38"/>
      <text x="50" y="88" font-family="Arial" font-weight="800" font-size="10" fill="#fff" text-anchor="middle" letter-spacing="1">CCL</text>
    </svg>
    <div class="header-text">
      <h1 id="headerTitle">Captain Woolly</h1>
      <span class="tagline" id="headerTagline">Choose Fun™ — Carnival Jubilee</span>
    </div>
  </div>
  <div class="header-right">
    <select class="lang-select" id="langSelect" onchange="setLanguage(this.value)">
      <option value="en">🇺🇸 EN</option>
      <option value="es">🇪🇸 ES</option>
      <option value="fr">🇫🇷 FR</option>
      <option value="de">🇩🇪 DE</option>
      <option value="it">🇮🇹 IT</option>
      <option value="pt">🇧🇷 PT</option>
      <option value="zh">🇨🇳 中文</option>
    </select>
    <button class="admin-btn" onclick="openAdmin()">⚙ Admin</button>
    <button class="pirate-toggle" id="pirateToggle" onclick="togglePirateMode()">
      <span>☠️</span>
      <div class="toggle-track"><div class="toggle-knob"></div></div>
    </button>
  </div>
</header>
<div class="wave-band">
  <svg viewBox="0 0 1440 14" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="1440" height="14" fill="#B61B38"/>
    <path d="M0 7 Q180 0 360 7 Q540 14 720 7 Q900 0 1080 7 Q1260 14 1440 7" stroke="#fff" stroke-width="1.5" fill="none" opacity=".4"/>
    <path d="M0 11 Q180 4 360 11 Q540 18 720 11 Q900 4 1080 11 Q1260 18 1440 11" stroke="#F6D003" stroke-width="1" fill="none" opacity=".6"/>
  </svg>
</div>
<div class="chat-body">
  <div class="status-bar" id="statusBar">Carnival Jubilee · Western Caribbean</div>
  <div class="messages" id="messages"></div>
  <div class="quick-replies" id="quickReplies"></div>
</div>
<div class="input-section">
  <div class="upload-area">
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()" title="Attach">📎</button>
    <div class="upload-pill" id="uploadPill"><span id="uploadPillName"></span><span style="cursor:pointer;margin-left:4px" onclick="clearUpload()">✕</span></div>
  </div>
  <div class="input-row">
    <textarea class="input-box" id="inputBox" placeholder="Ask Captain Woolly anything..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
  <input type="file" id="fileInput" style="display:none" onchange="handleFileSelect(event)">
</div>
<div class="admin-overlay" id="adminOverlay" onclick="overlayClick(event)">
  <div class="admin-panel">
    <div class="admin-header">
      <h2>⚙ Captain Woolly — Admin Dashboard</h2>
      <button class="admin-close" onclick="closeAdmin()">✕</button>
    </div>
    <div class="admin-pw-screen" id="adminPwScreen">
      <div style="font-size:32px">🔐</div>
      <h3>Admin Access</h3>
      <input class="admin-pw-input" type="password" id="adminPwInput" placeholder="••••••" onkeydown="if(event.key==='Enter')checkAdminPw()">
      <button class="admin-pw-btn" onclick="checkAdminPw()">Enter</button>
      <span class="admin-pw-error" id="adminPwError">Incorrect password</span>
    </div>
    <div id="adminContent" style="display:none;flex:1;overflow:hidden;flex-direction:column">
      <div class="admin-tabs">
        <button class="admin-tab active" onclick="switchTab('requests',this)">🔔 Service Requests <span id="pendingBadge"></span></button>
        <button class="admin-tab" onclick="switchTab('manifest',this)">📋 Cabin Manifest</button>
        <button class="admin-tab" onclick="switchTab('chat',this)">💬 Chat Log</button>
      </div>
      <div class="admin-body" id="adminBody"></div>
    </div>
  </div>
</div>
<script>
const CABINS={"1001L":{first:"Betty",last:"Flores"},"1006":{first:"Melissa",last:"Johnson"},"1011L":{first:"Katherine",last:"Scott"},"1071":{first:"Kathleen",last:"Wright"},"1081R":{first:"Helen",last:"Martinez"},"1082L":{first:"Raymond",last:"Allen"},"1115R":{first:"David",last:"Bennett"},"1129L":{first:"Nancy",last:"Cook"},"1140L":{first:"Jeffrey",last:"Turner"},"1199":{first:"Samantha",last:"Davis"},"1205":{first:"David",last:"Flores"},"1221":{first:"Brian",last:"James"},"1229":{first:"Eric",last:"Collins"},"1235":{first:"Charles",last:"Carter"},"1235L":{first:"Nicholas",last:"Thomas"},"1244R":{first:"Kenneth",last:"Hernandez"},"1249":{first:"Barbara",last:"Gray"},"1275":{first:"Carolyn",last:"White"},"1277":{first:"Thomas",last:"Nelson"},"1283":{first:"Kevin",last:"Taylor"},"1403":{first:"Eric",last:"Brooks"},"1412":{first:"Thomas",last:"Taylor"},"1482R":{first:"Anna",last:"Hill"},"672L":{first:"Dorothy",last:"Long"},"677R":{first:"Christine",last:"Adams"},"685L":{first:"Pamela",last:"Rivera"},"693R":{first:"Nancy",last:"Rodriguez"},"704R":{first:"Sandra",last:"Edwards"},"712":{first:"Carolyn",last:"Watson"},"720L":{first:"Nancy",last:"Johnson"},"728L":{first:"William",last:"Turner"},"746R":{first:"Steven",last:"Anderson"},"749":{first:"Emma",last:"Rivera"},"749R":{first:"James",last:"Myers"},"778L":{first:"Rachel",last:"Torres"},"787":{first:"Christopher",last:"Rodriguez"},"788R":{first:"Frank",last:"Diaz"},"828R":{first:"Rachel",last:"Wright"},"834L":{first:"Dorothy",last:"Ramirez"},"848L":{first:"Ryan",last:"Smith"},"848R":{first:"Angela",last:"Diaz"},"865":{first:"Brandon",last:"Martin"},"905R":{first:"Gregory",last:"Gomez"},"921":{first:"Karen",last:"Collins"},"929L":{first:"Eric",last:"Williams"},"973R":{first:"Jessica",last:"Foster"},"984":{first:"Christopher",last:"Nguyen"},"986R":{first:"Jeffrey",last:"Gray"},"991":{first:"William",last:"Flores"},"996R":{first:"Sarah",last:"White"}};
const SERVICE_KEYWORDS={towels:{label:"Extra Towels",icon:"🛁",category:"housekeeping",eta:"15-20 minutes"},sheets:{label:"Fresh Sheets",icon:"🛏",category:"housekeeping",eta:"20-30 minutes"},blanket:{label:"Extra Blanket",icon:"🛏",category:"housekeeping",eta:"15-20 minutes"},pillow:{label:"Extra Pillow",icon:"🛏",category:"housekeeping",eta:"15-20 minutes"},housekeep:{label:"Housekeeping",icon:"🧹",category:"housekeeping",eta:"20-30 minutes"},clean:{label:"Stateroom Cleaning",icon:"🧹",category:"housekeeping",eta:"20-30 minutes"},broken:{label:"Maintenance Request",icon:"🔧",category:"maintenance",eta:"30-45 minutes"},fix:{label:"Maintenance Request",icon:"🔧",category:"maintenance",eta:"30-45 minutes"},repair:{label:"Maintenance Request",icon:"🔧",category:"maintenance",eta:"30-45 minutes"},leak:{label:"Plumbing Issue",icon:"🔧",category:"maintenance",eta:"20-30 minutes"},toilet:{label:"Bathroom Issue",icon:"🔧",category:"maintenance",eta:"20-30 minutes"},ac:{label:"A/C Issue",icon:"❄️",category:"maintenance",eta:"30-45 minutes"},heat:{label:"Temperature Issue",icon:"🌡",category:"maintenance",eta:"30-45 minutes"},noise:{label:"Noise Complaint",icon:"🔇",category:"guest-services",eta:"15-20 minutes"},ice:{label:"Ice Bucket",icon:"🧊",category:"housekeeping",eta:"10-15 minutes"},toiletries:{label:"Toiletry Restock",icon:"🧴",category:"housekeeping",eta:"15-20 minutes"},soap:{label:"Toiletry Restock",icon:"🧴",category:"housekeeping",eta:"15-20 minutes"},shampoo:{label:"Toiletry Restock",icon:"🧴",category:"housekeeping",eta:"15-20 minutes"}};
function detectServiceRequest(t){const l=t.toLowerCase();for(const[k,i]of Object.entries(SERVICE_KEYWORDS)){if(l.includes(k))return i;}return null;}
let currentLang='en',pirateMode=false,chatHistory=[],pendingRequest=null,serviceRequests=[],adminUnlocked=false,activeTab='requests';
const ADMIN_PW='Ron';
const LANG_CONFIG={en:{placeholder:"Ask Captain Woolly anything...",status:"Carnival Jubilee · Western Caribbean",sys:"Respond in English."},es:{placeholder:"Pregúntale al Capitán Woolly...",status:"Carnival Jubilee · Caribe Occidental",sys:"Responde en español."},fr:{placeholder:"Demandez au Capitaine Woolly...",status:"Carnival Jubilee · Caraïbes Occidentales",sys:"Réponds en français."},de:{placeholder:"Fragen Sie Kapitän Woolly...",status:"Carnival Jubilee · Westliche Karibik",sys:"Antworte auf Deutsch."},it:{placeholder:"Chiedi al Capitano Woolly...",status:"Carnival Jubilee · Caraibi Occidentali",sys:"Rispondi in italiano."},pt:{placeholder:"Pergunte ao Capitão Woolly...",status:"Carnival Jubilee · Caribe Ocidental",sys:"Responda em português."},zh:{placeholder:"向 Woolly 船长提问...",status:"嘉年华庆典号 · 西加勒比海",sys:"请用中文回答。"}};
function buildSystemPrompt(){const l=LANG_CONFIG[currentLang];return `You are Captain Woolly, the cheerful AI concierge aboard the Carnival Jubilee — Carnival Cruise Line's Excel-class ship. Homeport: Galveston TX. 7-night Western Caribbean: Cozumel, Roatan, Belize City, Costa Maya. ${pirateMode?'PIRATE MODE: Respond in pirate speak with Arr, Ahoy, matey.':''} SHIP: BOLT roller coaster at sea, Emeril's Bistro 1396, Big Chicken by Shaq, Punchliner Comedy, WaterWorks, Cloud 9 Spa, Serenity adults-only deck, Casino, Ji Ji Asian, Bonsai Sushi, Steakhouse, Cucina del Capitano. SERVICE REQUESTS: If guest asks for towels/sheets/housekeeping/maintenance/ice/toiletries - ask for cabin number, look up guest name, greet as Mr/Ms LastName, confirm ETA. Say Carnival Cruise Line not Lines. Guests not passengers. Staterooms not rooms. ${l.sys} Be warm, fun, enthusiastic!`;}
function formatTime(){return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}
function scrollBottom(){const m=document.getElementById('messages');setTimeout(()=>m.scrollTop=m.scrollHeight,50);}
function formatContent(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/**(.+?)**/g,'<strong>$1</strong>').replace(/*(.+?)*/g,'<em>$1</em>').replace(/
/g,'<br>');}
function addMessage(role,content,extra){const msgs=document.getElementById('messages');const div=document.createElement('div');div.className='msg '+(role==='user'?'user':'nora');const isNora=role!=='user';const av=pirateMode?'☠️':(isNora?'⚓':'👤');div.innerHTML=`<div class="avatar ${isNora?'nora-av':'user-av'}">${av}</div><div><div class="bubble">${formatContent(content)}</div>${extra||''}<div class="msg-time">${formatTime()}</div></div>`;msgs.appendChild(div);scrollBottom();return div;}
function addTyping(){const msgs=document.getElementById('messages');const div=document.createElement('div');div.className='msg nora';div.id='typingIndicator';div.innerHTML=`<div class="avatar nora-av">${pirateMode?'☠️':'⚓'}</div><div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;msgs.appendChild(div);scrollBottom();}
function removeTyping(){document.getElementById('typingIndicator')?.remove();}
function setQuickReplies(chips){const qr=document.getElementById('quickReplies');qr.innerHTML='';chips.forEach(c=>{const btn=document.createElement('button');btn.className='qr-chip';btn.textContent=c;btn.onclick=()=>{qr.innerHTML='';sendMessage(c);};qr.appendChild(btn);});}
function buildServiceCard(req,cabin,guest){return `<div class="service-card"><div class="sc-header"><span class="sc-icon">${req.icon}</span><span class="sc-title">${req.label}</span><span class="sc-badge">✓ Submitted</span></div><div class="sc-row">🛳 <strong>Cabin:</strong> ${cabin}</div><div class="sc-row">👤 <strong>Guest:</strong> ${guest.first} ${guest.last}</div><div class="sc-row">📂 <strong>Team:</strong> ${req.category}</div><div class="sc-eta">⏱ ETA: ${req.eta}</div></div>`;}
function submitServiceRequest(req,cabin,guest){const e={id:Date.now(),type:req.label,icon:req.icon,category:req.category,cabin,guestFirst:guest.first,guestLast:guest.last,eta:req.eta,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),status:'pending'};serviceRequests.unshift(e);updatePendingBadge();return e;}
function updatePendingBadge(){const c=serviceRequests.filter(r=>r.status==='pending').length;const b=document.getElementById('pendingBadge');if(b)b.textContent=c>0?`(${c})`:''; }
async function sendMessage(override){const box=document.getElementById('inputBox');const text=(override||box.value).trim();if(!text)return;if(!override){box.value='';box.style.height='auto';}document.getElementById('quickReplies').innerHTML='';document.getElementById('sendBtn').disabled=true;addMessage('user',text);chatHistory.push({role:'user',content:text});
if(pendingRequest&&pendingRequest.waitingForCabin){const k=text.toUpperCase().replace(/s/g,'');const g=CABINS[k];if(!g){const nf=`I wasn't able to find cabin ${text}. Could you double-check? Find it on your key card or in the HUB app.`;addMessage('nora',nf);chatHistory.push({role:'assistant',content:nf});document.getElementById('sendBtn').disabled=false;return;}const req=pendingRequest.requestInfo;submitServiceRequest(req,k,g);const card=buildServiceCard(req,k,g);const salut=`${g.last.endsWith('s')?'Ms.':'Mr.'} ${g.last}`;const confirm=`Thank you, ${salut}! 🎉 Your request for **${req.label}** has been sent to our ${req.category} team and will arrive within **${req.eta}**. Anything else I can help with?`;addMessage('nora',confirm,card);chatHistory.push({role:'assistant',content:confirm});pendingRequest=null;setQuickReplies(['Dining options','Entertainment tonight','Shore excursions','Spa booking']);document.getElementById('sendBtn').disabled=false;return;}
const svc=detectServiceRequest(text);if(svc){pendingRequest={requestInfo:svc,waitingForCabin:true};const ask=`Of course! I'll get that arranged right away. 🛳️\n\nCould you please provide your **cabin number**? You can find it on your key card or in the Carnival HUB app.`;addMessage('nora',ask);chatHistory.push({role:'assistant',content:ask});document.getElementById('sendBtn').disabled=false;return;}
addTyping();try{const resp=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1000,stream:true,system:buildSystemPrompt(),messages:chatHistory.map(m=>({role:m.role,content:m.content}))})});if(!resp.ok)throw new Error('API error '+resp.status);removeTyping();const msgs=document.getElementById('messages');const div=document.createElement('div');div.className='msg nora';div.innerHTML=`<div class="avatar nora-av">${pirateMode?'☠️':'⚓'}</div><div><div class="bubble" id="streamBubble"></div><div class="msg-time">${formatTime()}</div></div>`;msgs.appendChild(div);scrollBottom();const bubble=document.getElementById('streamBubble');const reader=resp.body.getReader();const decoder=new TextDecoder();let full='';while(true){const{done,value}=await reader.read();if(done)break;for(const line of decoder.decode(value,{stream:true}).split('\n')){if(!line.startsWith('data:'))continue;const d=line.slice(5).trim();if(d==='[DONE]')break;try{const ev=JSON.parse(d);if(ev.type==='content_block_delta'&&ev.delta?.text){full+=ev.delta.text;bubble.innerHTML=formatContent(full);scrollBottom();}}catch{}}}bubble.removeAttribute('id');chatHistory.push({role:'assistant',content:full});setQuickReplies(["What's for dinner?",'BOLT roller coaster',"Today's port",'Spa hours']);}catch(err){removeTyping();addMessage('nora',`Something went sideways — let's try again! (${err.message})`);}document.getElementById('sendBtn').disabled=false;}
function handleFileSelect(e){const f=e.target.files[0];if(!f)return;document.getElementById('uploadPillName').textContent=f.name;document.getElementById('uploadPill').classList.add('show');}
function clearUpload(){document.getElementById('uploadPill').classList.remove('show');document.getElementById('fileInput').value='';}
function openAdmin(){document.getElementById('adminOverlay').classList.add('open');if(!adminUnlocked){document.getElementById('adminPwScreen').style.display='flex';document.getElementById('adminContent').style.display='none';setTimeout(()=>document.getElementById('adminPwInput').focus(),100);}else{renderAdminTab(activeTab);}}
function closeAdmin(){document.getElementById('adminOverlay').classList.remove('open');}
function overlayClick(e){if(e.target===document.getElementById('adminOverlay'))closeAdmin();}
function checkAdminPw(){const v=document.getElementById('adminPwInput').value;if(v===ADMIN_PW){adminUnlocked=true;document.getElementById('adminPwScreen').style.display='none';const c=document.getElementById('adminContent');c.style.display='flex';c.style.flexDirection='column';c.style.flex='1';c.style.overflow='hidden';renderAdminTab('requests');}else{document.getElementById('adminPwError').style.display='block';document.getElementById('adminPwInput').value='';}}
function switchTab(t,el){activeTab=t;document.querySelectorAll('.admin-tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');renderAdminTab(t);}
function renderAdminTab(t){const b=document.getElementById('adminBody');if(t==='requests')renderRequestsTab(b);else if(t==='manifest')renderManifestTab(b);else if(t==='chat')renderChatTab(b);}
function renderRequestsTab(b){if(!serviceRequests.length){b.innerHTML='<div class="empty-state"><div class="es-icon">🎉</div>No service requests yet. Guest requests will appear here.</div>';return;}b.innerHTML=serviceRequests.map(r=>`<div class="req-card ${r.status}" id="req-${r.id}"><div class="req-card-top"><div class="req-icon">${r.icon}</div><div class="req-info"><div class="req-type">${r.type}</div><div class="req-guest">Cabin ${r.cabin} — ${r.guestFirst} ${r.guestLast}</div><div class="req-time">Submitted ${r.time} · ETA: ${r.eta}</div></div><span class="req-badge ${r.status}">${r.status==='pending'?'⏳ Pending':'✓ Resolved'}</span></div>${r.status==='pending'?`<div class="req-actions"><button class="req-btn resolve" onclick="resolveRequest(${r.id})">✓ Mark Resolved</button><button class="req-btn dismiss" onclick="dismissRequest(${r.id})">Dismiss</button></div>`:''}</div>`).join('');}
function resolveRequest(id){const r=serviceRequests.find(x=>x.id===id);if(r){r.status='resolved';updatePendingBadge();renderRequestsTab(document.getElementById('adminBody'));}}
function dismissRequest(id){serviceRequests=serviceRequests.filter(x=>x.id!==id);updatePendingBadge();renderRequestsTab(document.getElementById('adminBody'));}
function renderManifestTab(b){b.innerHTML='<input class="manifest-search" id="mSearch" placeholder="Search cabin or name..." oninput="filterManifest()"><table class="manifest-table"><thead><tr><th>Cabin</th><th>First</th><th>Last</th></tr></thead><tbody id="mBody">'+Object.entries(CABINS).map(([c,g])=>`<tr data-c="${c}" data-n="${g.first} ${g.last}"><td>${c}</td><td>${g.first}</td><td>${g.last}</td></tr>`).join('')+'</tbody></table>';}
function filterManifest(){const q=document.getElementById('mSearch').value.toLowerCase();document.querySelectorAll('#mBody tr').forEach(tr=>{tr.style.display=(tr.dataset.c.toLowerCase().includes(q)||tr.dataset.n.toLowerCase().includes(q))?'':'none';});}
function renderChatTab(b){if(!chatHistory.length){b.innerHTML='<div class="empty-state"><div class="es-icon">💬</div>No messages yet.</div>';return;}b.innerHTML=chatHistory.map(m=>`<div style="margin-bottom:10px;padding:10px 14px;background:${m.role==='user'?'#e8f0fe':'#f8f9fa'};border-radius:10px;border-left:3px solid ${m.role==='user'?'#014E8F':'#B61B38'}"><div style="font-size:11px;font-weight:700;color:${m.role==='user'?'#014E8F':'#B61B38'};margin-bottom:4px">${m.role==='user'?'👤 Guest':'⚓ Captain Woolly'}</div><div style="font-size:13px;color:#333;white-space:pre-wrap">${m.content.replace(/</g,'&lt;')}</div></div>`).join('');}
function togglePirateMode(){pirateMode=!pirateMode;document.getElementById('app').classList.toggle('pirate-mode',pirateMode);document.getElementById('pirateToggle').classList.toggle('on',pirateMode);document.getElementById('headerTitle').textContent=pirateMode?'Captain Woolly ☠️':'Captain Woolly';document.getElementById('headerTagline').textContent=pirateMode?'Arrr, Choose Fun or Walk the Plank™':'Choose Fun™ — Carnival Jubilee';document.getElementById('statusBar').textContent=pirateMode?'Carnival Jubilee · ☠️ Pirate Mode':(LANG_CONFIG[currentLang].status);addMessage('nora',pirateMode?"Ahoy! 🏴‍☠️ Pirate Mode activated! Ask me anything and I'll answer in the finest pirate tongue! Arr! ⚓":"Welcome back! 🎉 Pirate Mode off. How can I help?");}
function setLanguage(l){currentLang=l;const c=LANG_CONFIG[l]||LANG_CONFIG.en;document.getElementById('inputBox').placeholder=c.placeholder;document.getElementById('statusBar').textContent=c.status;}
(function(){setTimeout(()=>{addMessage('nora',"Ahoy and welcome aboard! 🎉\n\nI'm Captain Woolly — your AI concierge on the Carnival Jubilee! Ask me about dining, the **BOLT** roller coaster, shore excursions, entertainment, or anything onboard.\n\nNeed something for your stateroom? Just ask — towels, housekeeping, maintenance — I'll get it routed right away! 🛳️");setQuickReplies(['Extra towels 🛁','Dining options 🍽','BOLT roller coaster 🎢','Shore excursions 🌴']);},400);if(/iPhone|iPad/.test(navigator.userAgent)){window.addEventListener('resize',()=>{document.documentElement.style.height=window.innerHeight+'px';});}})();
</script>
</body>
</html>
